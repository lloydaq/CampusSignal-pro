[project]
name = "campussignal-backend"
version = "0.1.0"
description = "CampusSignal API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.4",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "N", "RUF"]
# Domain exception names (NotFound, Forbidden, Conflict, ...) follow architecture.md §12.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and deliberately fake secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
