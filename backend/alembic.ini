# Alembic configuration. The database URL is NOT stored here: alembic/env.py reads
# DATABASE_URL through app settings (backend/.env locally, environment in CI/deploys).
# Run Alembic from the backend/ directory: `uv run alembic upgrade head`.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Revisions are numbered explicitly (0001_, 0002_, ...) for readable history.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
