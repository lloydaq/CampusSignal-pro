"none" stroke="#FF9566" stroke-width="2"/><circle cx="1110" cy="160" r="4" fill="#FF9566"/><text x="876" y="222" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E7EAF0" text-anchor="start" >Notices and notifications</text><text x="876" y="252" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >College and department notices with</text><text x="876" y="274" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >urgent pins. Notification bell next.</text></g><g class="rise" style="animation-delay:0.24s"><rect x="40" y="325" width="386" height="186" rx="8" fill="#171D2B" stroke="#2A3245"/><rect x="62" y="347" width="44" height="44" rx="8" fill="#1F2A47"/><g transform="translate(72 357) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g><g transform="translate(335 355)"><rect x="0" y="0" width="69" height="25" rx="4" fill="#121827"/><text x="34.52" y="16" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#A6AFBF" text-anchor="middle" >Planned</text></g><text x="62" y="429" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E7EAF0" text-anchor="start" >Campus issue reporting</text><text x="62" y="459" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >Report a problem, follow its status,</text><text x="62" y="481" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >coordinators work the queue.</text></g><g class="rise" style="animation-delay:0.32s"><rect x="447" y="325" width="386" height="186" rx="8" fill="#171D2B" stroke="#2A3245"/><rect x="469" y="347" width="44" height="44" rx="8" fill="#1F2A47"/><g transform="translate(479 357) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g><g transform="translate(742 355)"><rect x="0" y="0" width="69" height="25" rx="4" fill="#121827"/><text x="34.52" y="16" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#A6AFBF" text-anchor="middle" >Planned</text></g><text x="469" y="429" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E7EAF0" text-anchor="start" >Moderated community</text><text x="469" y="459" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >College and department feeds with</text><text x="469" y="481" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >reactions, reports and moderation.</text></g><g class="rise" style="animation-delay:0.40s"><rect x="854" y="325" width="386" height="186" rx="8" fill="#171D2B" stroke="#2A3245"/><rect x="876" y="347" width="44" height="44" rx="8" fill="#1F2A47"/><g transform="translate(886 357) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></g><g transform="translate(1149 355)"><rect x="0" y="0" width="69" height="25" rx="