<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d"><title id="t">Features</title><desc id="d">Six areas of CampusSignal and their status: accounts and colleges are built, notices and notifications are in progress, issues, community and the Academic Hub are planned.</desc><style>
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes blocked { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 55%, 70% { transform: translateX(var(--d)); opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes shake { 0%, 52%, 100% { transform: none; } 56% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 64% { transform: none; } }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.fade { animation: fade .9s ease-out both; }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
.flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
.travel { animation: travel 3.2s ease-in-out infinite; }
.blocked { animation: blocked 3.2s ease-in-out infinite; }
.shake { transform-box: fill-box; animation: shake 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .rise, .fade, .ping, .flow, .travel, .blocked, .shake { animation: none !important; }
  .ping, .travel, .blocked { display: none; }
}
</style><rect width="1280" height="520" rx="12" fill="#0F1420"/><text x="40" y="58" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#E7EAF0" text-anchor="start" >What it does</text><text x="40" y="86" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#A6AFBF" text-anchor="start" >Built in vertical slices, each with allow, cross-college and wrong-role tests.</text><g class="rise" style="animation-delay:0.00s"><rect x="40" y="118" width="386" height="186" rx="8" fill="#171D2B" stroke="#2A3245"/><rect x="62" y="140" width="44" height="44" rx="8" fill="#1F2A47"/><g transform="translate(72 150) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></g><g transform="translate(348 148)"><rect x="0" y="0" width="56" height="25" rx="4" fill="#12301F"/><text x="27.8" y="16" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#5BD08A" text-anchor="middle" >Built</text></g><text x="62" y="222" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E7EAF0" text-anchor="start" >Accounts and sessions</text><text x="62" y="252" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >Registration, email verification, password</text><text x="62" y="274" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#A6AFBF" text-anchor="start" >reset, server-side sessions with CSRF.</text></g><g class="rise" style="animation-delay:0.08s"><rect x="447" y="118" width="386" height="186" rx="8" fill="#171D2B" stroke="#2A3245"/><rect x="469" y="140" width="44