<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="290" viewBox="0 0 1280 290" role="img" aria-labelledby="t d"><title id="t">Roadmap</title><desc id="d">Phases 0 to 3 are done, phase 4 (notices and notifications) is in progress, phases 5 to 11 are next. Release alpha after phase 4, beta after phase 6, MVP after phase 10.</desc><style>
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes blocked { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 55%, 70% { transform: translateX(var(--d)); opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes shake { 0%, 52%, 100% { transform: none; } 56% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 64% { transform: none; } }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.fade { animation: fade .9s ease-out both; }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
.flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
.travel { animation: travel 3.2s ease-in-out infinite; }
.blocked { animation: blocked 3.2s ease-in-out infinite; }
.shake { transform-box: fill-box; animation: shake 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .rise, .fade, .ping, .flow, .travel, .blocked, .shake { animation: none !important; }
  .ping, .travel, .blocked { display: none; }
}
</style><rect width="1280" height="290" rx="12" fill="#0F1420"/><text x="40" y="58" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#E7EAF0" text-anchor="start" >Roadmap</text><text x="40" y="86" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#A6AFBF" text-anchor="start" >Phase 4 in progress: notices and notifications backend done, screens next.</text><line x1="90" y1="170" x2="1190" y2="170" stroke="#2A3245" stroke-width="4" stroke-linecap="round"/><line x1="90" y1="170" x2="490.0" y2="170" stroke="#93AEF5" stroke-width="4" stroke-linecap="round"/><g class="rise" style="animation-delay:0.00s"><circle cx="90.0" cy="170" r="15" fill="#93AEF5"/><path d="M84.0 170 l4 4 l8 -8" fill="none" stroke="#0F1420" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >0</text><text x="90.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#E7EAF0" text-anchor="middle" >Setup</text></g><g class="rise" style="animation-delay:0.05s"><circle cx="190.0" cy="170" r="15" fill="#93AEF5"/><path d="M184.0 170 l4 4 l8 -8" fill="none" stroke="#0F1420" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="190.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >1</text><text x="190.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#E7EAF0" text-anchor="middle" >Foundation</text></g><g class="rise" style="animation-delay:0.10s"><circle cx="290.0" cy="170" r="15" fill="#93AEF5"/><path d="M284.0 170 l4 4 l8 -8" fill="none" stroke="#0F1420" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="290.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >2</text><text x="290.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#E7EAF0" text-anchor="middle" >Identity</text></g><g class="rise" style="animation-delay:0.15s"><circle cx="390.0" cy="170" r="15" fill="#93AEF5"/><path d="M384.0 170 l4 4 l8 -8" fill="none" stroke="#0F1420" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="390.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >3</text><text x="390.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#E7EAF0" text-anchor="middle" >Colleges</text></g><g class="rise" style="animation-delay:0.20s"><circle class="ping" cx="490.0" cy="170" r="15" fill="none" stroke="#FF9566" stroke-width="2"/><circle cx="490.0" cy="170" r="15" fill="#171D2B" stroke="#FF9566" stroke-width="3"/><circle cx="490.0" cy="170" r="5" fill="#FF9566"/><text x="490.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >4</text><text x="490.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#E7EAF0" text-anchor="middle" >Notices</text><g transform="translate(451 118)"><rect x="0" y="0" width="77" height="24" rx="4" fill="#1F2A47"/><text x="38.72" y="15" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#93AEF5" text-anchor="middle" >Release α</text></g></g><g class="rise" style="animation-delay:0.25s"><circle cx="590.0" cy="170" r="15" fill="#171D2B" stroke="#6E788E" stroke-width="2"/><text x="590.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >5</text><text x="590.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="middle" >Issues</text></g><g class="rise" style="animation-delay:0.30s"><circle cx="690.0" cy="170" r="15" fill="#171D2B" stroke="#6E788E" stroke-width="2"/><text x="690.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >6</text><text x="690.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="middle" >Community</text><g transform="translate(651 118)"><rect x="0" y="0" width="77" height="24" rx="4" fill="#1F2A47"/><text x="38.72" y="15" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#93AEF5" text-anchor="middle" >Release β</text></g></g><g class="rise" style="animation-delay:0.35s"><circle cx="790.0" cy="170" r="15" fill="#171D2B" stroke="#6E788E" stroke-width="2"/><text x="790.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >7</text><text x="790.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="middle" >Academic</text></g><g class="rise" style="animation-delay:0.40s"><circle cx="890.0" cy="170" r="15" fill="#171D2B" stroke="#6E788E" stroke-width="2"/><text x="890.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >8</text><text x="890.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="middle" >Home</text></g><g class="rise" style="animation-delay:0.45s"><circle cx="990.0" cy="170" r="15" fill="#171D2B" stroke="#6E788E" stroke-width="2"/><text x="990.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >9</text><text x="990.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="middle" >Hardening</text></g><g class="rise" style="animation-delay:0.50s"><circle cx="1090.0" cy="170" r="15" fill="#171D2B" stroke="#6E788E" stroke-width="2"/><text x="1090.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >10</text><text x="1090.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="middle" >Launch</text><g transform="translate(1070 118)"><rect x="0" y="0" width="40" height="24" rx="4" fill="#1F2A47"/><text x="20.240000000000002" y="15" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#93AEF5" text-anchor="middle" >MVP</text></g></g><g class="rise" style="animation-delay:0.55s"><circle cx="1190.0" cy="170" r="15" fill="#171D2B" stroke="#6E788E" stroke-width="2"/><text x="1190.0" y="214" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8A93A5" text-anchor="middle" >11</text><text x="1190.0" y="234" font-family="'IBM Plex Sans','Segoe UI','Helv