<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d"><title id="t">Architecture</title><desc id="d">Browser to Caddy to the FastAPI backend (routers, policies, services, repositories) to PostgreSQL 17, with a mailer and an hourly jobs CLI.</desc><style>
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes blocked { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 55%, 70% { transform: translateX(var(--d)); opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes shake { 0%, 52%, 100% { transform: none; } 56% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 64% { transform: none; } }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.fade { animation: fade .9s ease-out both; }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
.flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
.travel { animation: travel 3.2s ease-in-out infinite; }
.blocked { animation: blocked 3.2s ease-in-out infinite; }
.shake { transform-box: fill-box; animation: shake 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .rise, .fade, .ping, .flow, .travel, .blocked, .shake { animation: none !important; }
  .ping, .travel, .blocked { display: none; }
}
</style><rect width="1280" height="470" rx="12" fill="#F6F7F9"/><text x="40" y="58" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#121826" text-anchor="start" >How it fits together</text><text x="40" y="86" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5263" text-anchor="start" >A modular monolith on one origin: no microservices, no queues, no WebSockets.</text><g class="rise"><rect x="40" y="140" width="220" height="120" rx="8" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/><text x="58" y="172" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#121826" text-anchor="start" >Browser</text><text x="58" y="196" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >React SPA</text><text x="58" y="217" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >TanStack Query</text><text x="58" y="238" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >cookies, no tokens</text></g><g class="rise" style="animation-delay:.1s"><rect x="320" y="140" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/><text x="338" y="172" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#121826" text-anchor="start" >Caddy</text><text x="338" y="196" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >TLS, static files</text><text x="338" y="217" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >/api → backend</text><text x="338" y="238" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >security headers</text></g><g class="rise" style="animation-delay:.2s"><rect x="580" y="116" width="360" height="300" rx="8" fill="#FFFFFF" stroke="#1D3C8F" stroke-width="2"/><text x="598" y="148" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#121826" text-anchor="start" >FastAPI backend</text><rect x="598" y="166" width="324" height="46" rx="6" fill="#EEF1F5"/><text x="614" y="187" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#121826" text-anchor="start" >api/v1</text><text x="614" y="204" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#4A5263" text-anchor="start" >routers: parse, call, respond</text><rect x="598" y="224" width="324" height="46" rx="6" fill="#E8EEFB"/><text x="614" y="245" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#1D3C8F" text-anchor="start" >policies</text><text x="614" y="262" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#4A5263" text-anchor="start" >every permission decision</text><rect x="598" y="282" width="324" height="46" rx="6" fill="#EEF1F5"/><text x="614" y="303" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#121826" text-anchor="start" >services</text><text x="614" y="320" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#4A5263" text-anchor="start" >business rules, transactions</text><rect x="598" y="340" width="324" height="46" rx="6" fill="#EEF1F5"/><text x="614" y="361" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#121826" text-anchor="start" >repositories</text><text x="614" y="378" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#4A5263" text-anchor="start" >queries scoped by college_id</text></g><g class="rise" style="animation-delay:.3s"><rect x="1000" y="140" width="240" height="120" rx="8" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/><text x="1018" y="172" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#121826" text-anchor="start" >PostgreSQL 17</text><text x="1018" y="196" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >composite (college_id, id)</text><text x="1018" y="217" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >foreign keys, row locks</text><text x="1018" y="238" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >append-only audit log</text></g><g class="rise" style="animation-delay:.4s"><rect x="1000" y="300" width="240" height="116" rx="8" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/><text x="1018" y="332" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#121826" text-anchor="start" >Jobs CLI</text><text x="1018" y="356" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >hourly retention purges</text><text x="1018" y="377" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >sessions, tokens,</text><text x="1018" y="398" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >notifications, audit</text></g><g class="rise" style="animation-delay:.5s"><rect x="320" y="300" width="200" height="116" rx="8" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/><text x="338" y="332" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#121826" text-anchor="start" >Mailer</text><text x="338" y="356" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >SMTP after commit</text><text x="338" y="377" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >Mailpit locally</text><text x="338" y="398" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5263" text-anchor="start" >tokens never logged</text></g><line class="flow" x1="260" y1="200" x2="320" y2="200" stroke="#868FA0" stroke-width="2"/><line class="flow" x1="520" y1="200" x2="580" y2="200" stroke="#868FA0" stroke-width="2"/><line class="flow" x1="940" y1="200" x2="1000" y2="200" stroke="#868FA0" stroke-width="2"/><line class="flow" x1="1120" y1="300" x2="1120" y2="260" stroke="#868FA0" stroke-width="2"/><line class="flow" x1="580" y1="358" x2="520" y2="358" stroke="#868FA0" stroke-width="2"/></svg>
