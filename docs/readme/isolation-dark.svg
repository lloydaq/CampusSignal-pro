<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d"><title id="t">Tenant isolation</title><desc id="d">How a request is scoped: the user's session leads to their active membership, which fixes the college. Requests reach their own college (200); anything in another college answers 404, exactly like something that doesn't exist.</desc><style>
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes blocked { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 55%, 70% { transform: translateX(var(--d)); opacity: 1; } 100% { transform: translateX(var(--d)); opacity: 0; } }
@keyframes shake { 0%, 52%, 100% { transform: none; } 56% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 64% { transform: none; } }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.fade { animation: fade .9s ease-out both; }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
.flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
.travel { animation: travel 3.2s ease-in-out infinite; }
.blocked { animation: blocked 3.2s ease-in-out infinite; }
.shake { transform-box: fill-box; animation: shake 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .rise, .fade, .ping, .flow, .travel, .blocked, .shake { animation: none !important; }
  .ping, .travel, .blocked { display: none; }
}
</style><rect width="1280" height="500" rx="12" fill="#0F1420"/><text x="40" y="58" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#E7EAF0" text-anchor="start" >Every request belongs to one college</text><text x="40" y="86" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#A6AFBF" text-anchor="start" >The college comes from your ACTIVE membership in the database, never from the request.</text><g class="rise" style="animation-delay:0.0s"><rect x="40" y="132" width="300" height="84" rx="8" fill="#171D2B" stroke="#2A3245"/><g transform="translate(60 162) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g><text x="100" y="170" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#E7EAF0" text-anchor="start" >Signed-in user</text><text x="100" y="194" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="start" >session cookie</text></g><line class="flow" x1="190" y1="216" x2="190" y2="244" stroke="#6E788E" stroke-width="2"/><g class="rise" style="animation-delay:0.1s"><rect x="40" y="244" width="300" height="84" rx="8" fill="#171D2B" stroke="#2A3245"/><g transform="translate(60 274) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></g><text x="100" y="282" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#E7EAF0" text-anchor="start" >Active membership</text><text x="100" y="306" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="start" >looked up server-side</text></g><line class="flow" x1="190" y1="328" x2="190" y2="356" stroke="#6E788E" stroke-width="2"/><g class="rise" style="animation-delay:0.2s"><rect x="40" y="356" width="300" height="84" rx="8" fill="#171D2B" stroke="#2A3245"/><g transform="translate(60 386) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 8-4 8 4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M14 22v-4a2 2 0 0 0-4 0v4"/><path d="M18 5v17"/><path d="M6 5v17"/></g><text x="100" y="394" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="600" fill="#E7EAF0" text-anchor="start" >college_id</text><text x="100" y="418" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="start" >Northfield Institute</text></g><g class="fade" style="animation-delay:.3s"><rect x="860" y="120" width="380" height="150" rx="8" fill="#171D2B" stroke="#93AEF5" stroke-width="2"/><g transform="translate(880 142) scale(1.0)" fill="none" stroke="#93AEF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 8-4 8 4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M14 22v-4a2 2 0 0 0-4 0v4"/><path d="M18 5v17"/><path d="M6 5v17"/></g><text x="916" y="160" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#E7EAF0" text-anchor="start" >Northfield Institute</text><rect x="880" y="184" width="8" height="8" rx="2" fill="#93AEF5"/><text x="898" y="192" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="start" >notices, members, roster</text><rect x="880" y="210" width="8" height="8" rx="2" fill="#93AEF5"/><text x="898" y="218" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="start" >departments and audit log</text><rect x="880" y="236" width="8" height="8" rx="2" fill="#93AEF5"/><text x="898" y="244" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#A6AFBF" text-anchor="start" >only Northfield's people</text></g><g class="fade" style="animation-delay:.4s"><rect x="860" y="306" width="380" height="150" rx="8" fill="#121827" stroke="#2A3245" stroke-width="1"/><g transform="translate(880 328) scale(1.0)" fill="none" stroke="#8A93A5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="916" y="346" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#8A93A5" text-anchor="start" >Riverside College</text><rect x="880" y="370" width="8" height="8" rx="2" fill="#6E788E"/><text x="898" y="378" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#8A93A5" text-anchor="start" >a different college</text><rect x="880" y="396" width="8" height="8" rx="2" fill="#6E788E"/><text x="898" y="404" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#8A93A5" text-anchor="start" >its rows carry its own college_id</text><rect x="880" y="422" width="8" height="8" rx="2" fill="#6E788E"/><text x="898" y="430" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#8A93A5" text-anchor="start" >composite keys keep them apart</text></g><path d="M340 386 H520 V195 H860" fill="none" stroke="#5BD08A" stroke-width="2.5"/><g transform="translate(560 175)"><rect x="0" y="0" width="153" height="26" rx="4" fill="#12301F"/><text x="76.52000000000001" y="17" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#5BD08A" text-anchor="middle" >200 · your college</text></g><circle class="travel" style="--d:330px" cx="525" cy="195" r="6" fill="#5BD08A"/><path d="M520 386 H730" fill="none" stroke="#FF8A80" stroke-width="2.5" stroke-dasharray="8 6"/><circle class="blocked" style="--d:195px" cx="525" cy="386" r="6" fill="#FF8A80"/><g class="shake"><rect x="738" y="364" width="44" height="44" rx="8" fill="#3A1A1C" stroke="#FF8A80"/><path d="M750 376 l20 20 M770 376 l-20 20" stroke="#FF8A80" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(560 410)"><rect x="0" y="0" width="189" height="26" rx="4" fill="#3A1A1C"/><text x="94.72000000000001" y="17" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#FF8A80" text-anchor="middle" >404 · same as not found</text></g></svg>
